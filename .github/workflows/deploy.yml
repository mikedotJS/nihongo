name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves at /<repo>/, donc on bake le base path à la build.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Secrets `based` — optionnels. Si absents, le bundle prod reste en
          # local-only (aucune connexion sortante).
          VITE_BASED_URL: ${{ secrets.VITE_BASED_URL }}
          VITE_BASED_ANON_KEY: ${{ secrets.VITE_BASED_ANON_KEY }}
          VITE_BASED_SESSION: ${{ secrets.VITE_BASED_SESSION }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
